# Kernel
CONFIG_MAIN_STACK_SIZE=2048
CONFIG_HEAP_MEM_POOL_SIZE=2048

# Console
CONFIG_SERIAL=y
CONFIG_CONSOLE=y
CONFIG_PRINTK=y

# GPIO
CONFIG_GPIO=y
# This enables the specific STM32F1xx HAL driver files

# SPI
CONFIG_SPI=y

# CAN
CONFIG_CAN=y
## STM32 requires specific clock settings for CAN, usually handled by Zephyr
CONFIG_CAN_STATS=y

# Debugger
CONFIG_DEBUG=y
CONFIG_DEBUG_OPTIMIZATIONS=y

# Logger
CONFIG_LOG=y
CONFIG_LOG_DEFAULT_LEVEL=3

# C++
CONFIG_CPP=y

CONFIG_STDOUT_CONSOLE=y
CONFIG_UART_CONSOLE=y

# Enable protobuf
CONFIG_NANOPB=y

# Persistent metrics storage
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_SETTINGS=y
CONFIG_NVS=y
CONFIG_SETTINGS_NVS=y
CONFIG_MPU_ALLOW_FLASH_WRITE=y
